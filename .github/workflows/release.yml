name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      publish_pypi:
        description: Publish through the protected PyPI environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: validate annotated release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Fetch protected main reference
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate tag, versions, changelog, and ancestry
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --require-git --json

      - name: Export immutable release identity
        id: metadata
        shell: bash
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: release gates (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Canonical release gates
        env:
          PYTHONPATH: src
        run: |
          python scripts/self_verify.py
          python scripts/check_docs.py
          python scripts/check_secrets.py
          python -m unittest discover -s tests -q
          python scripts/smoke_installed_matrix.py

  build:
    name: build release bytes once
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Revalidate pinned release identity
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          python scripts/check_release.py \
            --tag "$RELEASE_TAG" \
            --require-git \
            --json

      - name: Install isolated release tooling
        run: python -m pip install --disable-pip-version-check build==1.5.0 twine==6.2.0

      - name: Pin one exact release identity
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          mkdir -p release-assets
          python scripts/prepare_build_identity.py \
            --output release-assets/build-identity.json \
            --expected-commit "$EXPECTED_COMMIT" \
            --require-release \
            --json > "$RUNNER_TEMP/build-identity-pin.json"
          identity_sha="$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sha256"])' \
            "$RUNNER_TEMP/build-identity-pin.json")"
          {
            echo "PORTABLE_RESUME_BUILD_IDENTITY_FILE=$GITHUB_WORKSPACE/release-assets/build-identity.json"
            echo "PORTABLE_RESUME_BUILD_IDENTITY_SHA256=$identity_sha"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$EXPECTED_COMMIT")"
          } >> "$GITHUB_ENV"

      - name: Build Python and host artifacts
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/build_host_packages.py \
            --output-dir release-assets/hosts \
            --identity-file "$PORTABLE_RESUME_BUILD_IDENTITY_FILE" \
            --identity-sha256 "$PORTABLE_RESUME_BUILD_IDENTITY_SHA256" \
            --json > release-assets/host-packages-build.json
          python scripts/verify_artifact_identities.py \
            --identity-file "$PORTABLE_RESUME_BUILD_IDENTITY_FILE" \
            --identity-sha256 "$PORTABLE_RESUME_BUILD_IDENTITY_SHA256" \
            --host-report release-assets/host-packages-build.json \
            --output release-assets/artifact-identities.json \
            dist/* release-assets/hosts/*.zip

      - name: Generate release evidence
        env:
          PYTHONPATH: src
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from portable_resume.registry import matrix_dimensions
          from portable_resume.build_identity import load_identity_file
          from scripts.git_build_identity import git_build_identity

          dimensions = matrix_dimensions()
          paths = sorted(
              [
                  *Path("dist").glob("*"),
                  *Path("release-assets/hosts").glob("*"),
                  Path("release-assets/host-packages-build.json"),
                  Path("release-assets/build-identity.json"),
                  Path("release-assets/artifact-identities.json"),
              ]
          )
          expected_commit = os.environ["RELEASE_COMMIT"]
          actual_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          identity = load_identity_file(
              Path("release-assets/build-identity.json"),
              expected_sha256=os.environ[
                  "PORTABLE_RESUME_BUILD_IDENTITY_SHA256"
              ],
          )
          host_report = json.loads(
              Path("release-assets/host-packages-build.json").read_text(
                  encoding="utf-8"
              )
          )
          if actual_commit != expected_commit:
              raise RuntimeError("build checkout differs from validated commit")
          current_identity = git_build_identity()
          if current_identity != identity:
              raise RuntimeError("build checkout changed after identity pinning")
          if Path("src/portable_resume/resources/build-identity.json").exists():
              raise RuntimeError("artifact build mutated the source package")
          if (
              identity.get("release_channel") != "release"
              or identity.get("commit_sha") != expected_commit
              or identity.get("dirty") is not False
              or identity.get("version") != os.environ["RELEASE_VERSION"]
          ):
              raise RuntimeError("release artifact identity is not exact and clean")
          if host_report.get("build_identity") != identity:
              raise RuntimeError("host archive identity differs from release identity")
          evidence = {
              "schema_version": "portable-resume/release-evidence-v1",
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_VERSION"],
              "commit_sha": expected_commit,
              "build_identity": identity,
              "build_identity_sha256": os.environ[
                  "PORTABLE_RESUME_BUILD_IDENTITY_SHA256"
              ],
              "actions_run": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/"
                  f"runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "verified_os": ["ubuntu-latest", "macos-latest"],
              "verified_python": ["3.11", "3.14"],
              "source_count": dimensions["sources"],
              "destination_count": dimensions["destinations"],
              "packaging_cells": dimensions["cells"],
              "installed_runner_cells": dimensions["cells"],
              "host_ui_nl": "not-run",
              "marketplace_ui_install": "not-run",
              "cursor_full_graph": "not-claimed",
              "artifacts": [
                  {
                      "path": path.as_posix(),
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in paths
                  if path.is_file()
              ],
          }
          Path("release-assets/release-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
        shell: bash

      - name: Write release checksums
        shell: bash
        run: |
          python scripts/write_release_checksums.py \
            --output release-assets/SHA256SUMS \
            dist/* \
            release-assets/hosts/* \
            release-assets/build-identity.json \
            release-assets/artifact-identities.json \
            release-assets/host-packages-build.json \
            release-assets/release-evidence.json

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            dist/*
            release-assets/**
          if-no-files-found: error
          retention-days: 30

  distribution-smoke:
    name: exact distribution (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .

      - name: Install and smoke wheel and sdist
        shell: bash
        run: |
          identity_sha="$(python -c \
            'import json; print(json.load(open("release-assets/artifact-identities.json", encoding="utf-8"))["build_identity_sha256"])')"
          PORTABLE_RESUME_BUILD_IDENTITY_FILE="$RUNNER_TEMP/poison-build-identity.json" \
          PORTABLE_RESUME_BUILD_IDENTITY_SHA256="$(printf '0%.0s' {1..64})" \
          python scripts/smoke_distribution.py \
            --dist-dir dist \
            --version "${{ needs.validate.outputs.version }}" \
            --identity-file release-assets/build-identity.json \
            --identity-sha256 "$identity_sha"

      - name: Verify flattened GitHub Release checksums
        shell: bash
        run: |
          mkdir flat-release
          cp dist/* release-assets/hosts/* \
            release-assets/build-identity.json \
            release-assets/artifact-identities.json \
            release-assets/host-packages-build.json \
            release-assets/release-evidence.json \
            release-assets/SHA256SUMS \
            flat-release/
          cd flat-release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi

  attest:
    name: attest release artifacts
    needs: [build, distribution-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .

      - name: Create GitHub artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            release-assets/hosts/*
            release-assets/build-identity.json
            release-assets/artifact-identities.json
            release-assets/host-packages-build.json
            release-assets/SHA256SUMS
            release-assets/release-evidence.json

  draft-release:
    name: stage GitHub Release
    needs: [validate, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .

      - name: Create or refresh draft release
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          read -r tag_type tag_sha < <(
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha'
          )
          [[ "$tag_type" == "tag" ]] || {
            echo "release ref is no longer an annotated tag" >&2
            exit 1
          }
          read -r target_type target_sha < <(
            gh api "repos/$GH_REPO/git/tags/$tag_sha" \
              --jq '.object.type + " " + .object.sha'
          )
          [[ "$target_type" == "commit" && "$target_sha" == "$EXPECTED_COMMIT" ]] || {
            echo "release tag moved after validation" >&2
            exit 1
          }
          files=(dist/* release-assets/hosts/* release-assets/SHA256SUMS \
            release-assets/build-identity.json release-assets/artifact-identities.json \
            release-assets/release-evidence.json release-assets/host-packages-build.json)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "refusing to replace assets on an already-published release" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag --draft --generate-notes \
              --title "Portable Resume ${RELEASE_TAG}"
          fi

  publish-pypi:
    name: publish exact bytes to PyPI
    if: github.event_name == 'push' || inputs.publish_pypi
    needs: [validate, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/portable-resume/${{ needs.validate.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .

      - name: Reassert immutable remote tag before PyPI publish
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          read -r tag_type tag_sha < <(
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha'
          )
          [[ "$tag_type" == "tag" ]] || exit 1
          read -r target_type target_sha < <(
            gh api "repos/$GH_REPO/git/tags/$tag_sha" \
              --jq '.object.type + " " + .object.sha'
          )
          [[ "$target_type" == "commit" && "$target_sha" == "$EXPECTED_COMMIT" ]] || {
            echo "release tag moved after validation" >&2
            exit 1
          }

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-release:
    name: publish staged GitHub Release
    if: >-
      always() &&
      needs.draft-release.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    needs: [validate, draft-release, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Reassert immutable remote tag before GitHub publish
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          read -r tag_type tag_sha < <(
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha'
          )
          [[ "$tag_type" == "tag" ]] || exit 1
          read -r target_type target_sha < <(
            gh api "repos/$GH_REPO/git/tags/$tag_sha" \
              --jq '.object.type + " " + .object.sha'
          )
          [[ "$target_type" == "commit" && "$target_sha" == "$EXPECTED_COMMIT" ]] || {
            echo "release tag moved after validation" >&2
            exit 1
          }

      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
