name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Version-independent gates once per workflow (issue #67).
  quality:
    name: quality (docs + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Quality gates (docs + secrets)
        run: python scripts/self_verify.py --profile ci-quality

  # OS × Python compatibility: interpreter-sensitive stages exactly once per cell.
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compat self-verify (no docs/secrets duplicate)
        run: python scripts/self_verify.py --profile ci-compat

      - name: Installed runner matrix
        env:
          PYTHONPATH: src
        run: python scripts/smoke_installed_matrix.py

  # Native Windows read-only qualification (#207/#208). One Python cell is enough
  # for shipped nt evidence; full multi-version stays on ubuntu/macos.
  test-windows:
    name: test (windows-latest / py3.12)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile + platform unit tests (Windows nt)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src scripts tests
          python -m unittest tests.unit.test_platform_fs tests.unit.test_platform_paths tests.unit.test_install_windows_platform_gate tests.unit.test_windows_relative_mutations tests.unit.test_windows_parent_chain_reparse tests.unit.test_output_write tests.unit.test_self_verify_profiles tests.integration.test_windows_install_adversarial -q

      - name: Product read-only surfaces (Windows nt)
        env:
          PYTHONPATH: src
        run: |
          python scripts/portable-resume self-check --json
          python scripts/install-resume-skills matrix
          python scripts/portable-resume sources --json
          python scripts/portable-resume doctor --json
          python scripts/portable-resume discover --cwd /workspace/project --json

      - name: All 17 sources fixture list+show (Windows nt)
        env:
          PYTHONPATH: src
        run: python scripts/self_verify.py --only windows_source_fixtures

      # Windows hard gate: focused product install smoke only (claude/cursor/codex).
      # Full 306-cell smoke_installed_matrix is Ubuntu-only — do not claim Windows 306/306.
      - name: Product install smoke (Windows nt hard gate)
        env:
          PYTHONPATH: src
        run: python scripts/smoke_windows_product_install.py

  issue263-apfs-proof:
    name: issue #263 real APFS COW proof
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove descriptor-bound APFS live-WAL snapshots
        env:
          PYTHONPATH: src
        run: |
          python scripts/prove_issue263_macos_apfs.py \
            --iterations 200 \
            --output issue263-proof/issue263-apfs-proof.json

      - name: Upload sanitized APFS proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue263-apfs-proof-${{ github.sha }}
          path: issue263-proof/issue263-apfs-proof.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: build and smoke distributions
    needs: [test, test-windows, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install isolated release tooling
        run: >-
          python -m pip install --disable-pip-version-check
          build==1.5.0 twine==6.2.0 setuptools==83.0.0

      - name: Reusable setuptools staging regression
        env:
          PORTABLE_RESUME_TEST_SETUPTOOLS_BUILD: "1"
          PYTHONPATH: src
        run: >-
          python -m unittest -v
          tests.unit.test_artifact_identity.ArtifactIdentityTests.test_build_py_refreshes_reusable_stale_identity

      - name: Pin one build identity
        shell: bash
        run: |
          test ! -e src/portable_resume/resources/build-identity.json
          git status --porcelain -- src/portable_resume \
            > "$RUNNER_TEMP/package-source-status.before"
          mkdir -p package-evidence
          python scripts/prepare_build_identity.py \
            --output package-evidence/build-identity.json \
            --json > "$RUNNER_TEMP/build-identity-pin.json"
          identity_sha="$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sha256"])' \
            "$RUNNER_TEMP/build-identity-pin.json")"
          {
            echo "PORTABLE_RESUME_BUILD_IDENTITY_FILE=$GITHUB_WORKSPACE/package-evidence/build-identity.json"
            echo "PORTABLE_RESUME_BUILD_IDENTITY_SHA256=$identity_sha"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            # Pre-tag release candidates pin exact X.Y.Z before vX.Y.Z exists;
            # allow development-channel smoke of stable base in CI only.
            echo "PORTABLE_RESUME_ALLOW_STABLE_DEVELOPMENT_IDENTITY=1"
          } >> "$GITHUB_ENV"

      - name: Build wheel and sdist
        shell: bash
        run: |
          python -m build
          python -m twine check dist/*
          mkdir dist-repro
          (umask 077 && python -m build --outdir dist-repro)
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" == "2" ]]
          [[ "$(find dist-repro -maxdepth 1 -type f | wc -l)" == "2" ]]
          for artifact in dist/*; do
            cmp "$artifact" "dist-repro/${artifact#dist/}"
          done
          test ! -e src/portable_resume/resources/build-identity.json
          git status --porcelain -- src/portable_resume \
            > "$RUNNER_TEMP/package-source-status.after"
          cmp "$RUNNER_TEMP/package-source-status.before" \
            "$RUNNER_TEMP/package-source-status.after"

      - name: Packaging determinism tests
        env:
          PYTHONPATH: src
        run: python scripts/self_verify.py --only packaging

      - name: Build deterministic host packages
        run: |
          python scripts/build_host_packages.py \
            --output-dir host-packages \
            --identity-file "$PORTABLE_RESUME_BUILD_IDENTITY_FILE" \
            --identity-sha256 "$PORTABLE_RESUME_BUILD_IDENTITY_SHA256"

      - name: Verify and smoke exact artifact identities
        run: |
          python scripts/verify_artifact_identities.py \
            --identity-file "$PORTABLE_RESUME_BUILD_IDENTITY_FILE" \
            --identity-sha256 "$PORTABLE_RESUME_BUILD_IDENTITY_SHA256" \
            --host-report host-packages/host-packages.json \
            --output package-evidence/artifact-identities.json \
            dist/* host-packages/*.zip
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_identity_file="$PORTABLE_RESUME_BUILD_IDENTITY_FILE"
          expected_identity_sha="$PORTABLE_RESUME_BUILD_IDENTITY_SHA256"
          PORTABLE_RESUME_BUILD_IDENTITY_FILE="$RUNNER_TEMP/poison-build-identity.json" \
          PORTABLE_RESUME_BUILD_IDENTITY_SHA256="$(printf '0%.0s' {1..64})" \
          python scripts/smoke_distribution.py \
            --dist-dir dist \
            --version "$VERSION" \
            --identity-file "$expected_identity_file" \
            --identity-sha256 "$expected_identity_sha"

      - name: Upload CI package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-package-evidence
          path: |
            dist/*
            host-packages/*
            package-evidence/*
          if-no-files-found: error
          retention-days: 14
