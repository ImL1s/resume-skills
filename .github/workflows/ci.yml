name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Version-independent gates once per workflow (issue #67).
  quality:
    name: quality (docs + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Quality gates (docs + secrets)
        run: python scripts/self_verify.py --profile ci-quality

  # OS × Python compatibility: interpreter-sensitive stages exactly once per cell.
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compat self-verify (no docs/secrets duplicate)
        run: python scripts/self_verify.py --profile ci-compat

      - name: Installed runner matrix
        env:
          PYTHONPATH: src
        run: python scripts/smoke_installed_matrix.py

  package:
    name: build and smoke distributions
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install isolated release tooling
        run: python -m pip install --disable-pip-version-check build==1.5.0 twine==6.2.0

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke exact distributions
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/smoke_distribution.py --dist-dir dist --version "$VERSION"

      - name: Build deterministic host packages
        run: python scripts/build_host_packages.py --output-dir host-packages

      - name: Upload CI package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-package-evidence
          path: |
            dist/*
            host-packages/*
          if-no-files-found: error
          retention-days: 14
