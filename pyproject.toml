[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-resume"
version = "0.4.3"
description = "Offline, local-only context migration across coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "portable-resume-skills contributors" }]
# Runtime is stdlib-only; no third-party dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/ImL1s/resume-skills"
Documentation = "https://github.com/ImL1s/resume-skills/tree/main/docs"
Repository = "https://github.com/ImL1s/resume-skills"
Issues = "https://github.com/ImL1s/resume-skills/issues"
Changelog = "https://github.com/ImL1s/resume-skills/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = []

[project.scripts]
portable-resume = "portable_resume.reader:main"
install-resume-skills = "portable_resume.install.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portable_resume = ["resources/*", "resources/**/*"]
